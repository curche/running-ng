# =============================================================================
# Phase 4 — representative subset: zarith_pi + infer_default O= sweep
# =============================================================================
# Part of the auto-compact tuning investigation (TASK 1 in PLAN.md).
# Completes coverage of the representative subset (owl_gc and
# pplacer_testsuite already swept — see owl_gc_O_sweep.yml,
# pplacer_O_sweep.yml). infer_default is the suite's first true
# multi-domain shared-heap workload (--multicore, OCaml 5 domains).
#
# infer is NOT included for socaml-auto-compact: it hits the same
# pre-existing ppxlib/AST version-skew build failure (Ptyp_functor missing)
# that already blocks several other benchmarks on socaml/socaml-auto-compact
# (alt_ergo, devkit, sedlex, irmin, frama-c, goblint, jsoo,
# liq_parse_typecheck, ocamlc_self_compile, coqc_corelib_stress) — a known,
# pre-existing limitation of that branch's base snapshot, not something to
# fix here.
#
# Reduced O= grid (vs. the 7-value focused sweeps) since the mechanism is
# now well understood: spans very aggressive to very lenient.
# =============================================================================

includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 5
  benchmarks:
    macro-zarith:
      - zarith_pi
    macro-infer:
      - infer_default

runtimes:
  ocaml-auto-compact:
    type: OCaml
    repo: "https://github.com/curche/ocaml.git"
    commit: "auto-compact-5.5"

  socaml-auto-compact:
    type: OCaml
    repo: "https://github.com/curche/ocaml.git"
    commit: "new_compactor"

modifiers:
  O:
    type: OCamlRunParam
    val: "O={0}"

configs:
  - "ocaml-auto-compact|perf_grp1|re-25|md-2"
  - "socaml-auto-compact|perf_grp1|re-25|md-2"

config_sweep:
  O: [5, 50, 500, 2000]
