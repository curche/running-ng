# =============================================================================
# Macro-benchmarks — automatic compaction comparison
# =============================================================================
# Compares three compiler variants to isolate the effect of each GC change:
#   - ocaml-5.5           : OCaml 5.5.0 (baseline — stock runtime 5 compactor)
#   - socaml              : OCaml 5.5 + chunk-based pool compactor, no auto-compact
#                           (branch: new_compactor @ 7f6d55c648)
#   - socaml-auto-compact : OCaml 5.5 + chunk-based compactor + automatic compaction
#                           (Compaction_auto, caml_max_percent_free default 500%)
#                           (branch: new_compactor @ 34988cfd7b)
#
# Comparison chain:
#   ocaml-5.5 → socaml              : effect of chunk-based pool compactor
#   socaml    → socaml-auto-compact : effect of automatic compaction
#
# High-signal benchmarks: owl (bigarrays + major GC), liq-video-frames
# (off-heap accounting), alt-ergo (weak hash-consing), zarith/coq
# (custom blocks + finalisation), menhir/cpdf (allocation-heavy compilation).
#
# Both socaml variants use pre-built opam switches (executable mode).
# Ensure dune and ocamlfind are installed in each switch before running:
#
#   opam install dune ocamlfind --switch socaml-20260630-140841 --yes
#   opam install dune ocamlfind --switch socaml-auto-compact-20260629-131142 --yes
# =============================================================================

includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 3
  suites.macro-coq-monorepo.timeout: 300

# =============================================================================
# Runtimes
# =============================================================================
runtimes:
  ocaml-5.5:
    type: OCaml
    version: "5.5.0"

  # Chunk-based pool compactor, no automatic compaction.
  # new_compactor branch @ 7f6d55c648
  socaml:
    type: OCaml
    executable: "/home/curche/.opam/socaml-20260630-140841/bin/ocaml"

  # Chunk-based pool compactor + automatic compaction (Compaction_auto,
  # caml_max_percent_free = 500% default, OCAMLRUNPARAM O= to tune).
  # new_compactor branch @ 34988cfd7b
  socaml-auto-compact:
    type: OCaml
    executable: "/home/curche/.opam/socaml-auto-compact-20260629-131142/bin/ocaml"

# =============================================================================
# Configs — baseline comparison at default GC settings
# =============================================================================
# re-25: 256 MB per-domain ring — required for owl_gc (overflows at re-23).
# md-2: minimum domain count for sequential workloads.
configs:
  - "ocaml-5.5|perf_grp1|re-25|md-2"
  - "socaml|perf_grp1|re-25|md-2"
  - "socaml-auto-compact|perf_grp1|re-25|md-2"

# =============================================================================
# Comparisons
# =============================================================================
comparisons:
  - label: "chunk-based compactor effect (5.5 vs socaml)"
    a: ocaml-5.5
    b: socaml

  - label: "automatic compaction effect (socaml vs socaml-auto-compact)"
    a: socaml
    b: socaml-auto-compact
