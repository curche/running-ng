# =============================================================================
# owl_gc — socaml-auto-compact chunk-size knob experiment
# =============================================================================
# Part of the auto-compact tuning investigation (TASK 1 in PLAN.md).
#
# Phase 2 found socaml-auto-compact's auto-compaction is structurally gated
# off for owl_gc (and zarith_pi): should_compact_from_stw_single's heap-size
# check (runtime/major_gc.c) requires heap_words > 2 * caml_shared_heap_grow_bsize(),
# which floors at a HARDCODED 8MB chunk-size constant (caml_pool_min_chunk_bsz,
# runtime/shared_heap.c) with no runtime knob -- so the gate never opens for
# owl_gc's ~830KB live heap, regardless of O=.
#
# This experiment adds a new OCAMLRUNPARAM 'i=<bytes>' to make that floor
# runtime-tunable (patch on branch new_compactor-chunk-knob, worktree at
# /home/curche/git/ocaml-compiler/ocaml-git-chunk-knob, built locally to
# /home/curche/opt/ocaml-socaml-chunk-knob -- not pushed to GitHub, no push
# credentials on this machine, so referenced here via `executable:` instead
# of `repo:`/`commit:`). Compares:
#   - socaml-auto-compact-manual : baseline new_compactor tip, rebuilt
#     locally with the identical process (for a clean, build-flag-matched
#     comparison rather than mixing in the existing opam-compiler-built
#     switch). Chunk size stays at the compiled-in 8MB default.
#   - socaml-auto-compact-chunk-knob : same source + the knob patch,
#     i=262144 (256KB chunk floor -- comfortably clears the 2x-heap gate
#     for owl_gc's ~830KB heap; 2*256KB=512KB < 830KB).
#
# O= swept across 750-1000 (per the auto-compact-tuning worklog's
# recommendation range) -- owl_gc's natural overhead is ~700-740%, so this
# range should span the real compaction-rate transition for the knob
# variant, while the baseline (gate closed) is expected to show ~0
# compactions throughout regardless of O=.
# =============================================================================

includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 5
  benchmarks:
    macro-owl:
      - owl_gc

runtimes:
  socaml-auto-compact-manual:
    type: OCaml
    executable: "/home/curche/opt/ocaml-socaml-baseline/bin/ocaml"

  socaml-auto-compact-chunk-knob:
    type: OCaml
    executable: "/home/curche/opt/ocaml-socaml-chunk-knob/bin/ocaml"

modifiers:
  O:
    type: OCamlRunParam
    val: "O={0}"
  i_chunk:
    type: OCamlRunParam
    val: "i=262144"

configs:
  - "socaml-auto-compact-manual|perf_grp1|re-25|md-2"
  - "socaml-auto-compact-chunk-knob|perf_grp1|re-25|md-2|i_chunk"

config_sweep:
  O: [750, 800, 850, 900, 950, 1000]
