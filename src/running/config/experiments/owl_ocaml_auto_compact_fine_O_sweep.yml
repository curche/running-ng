# =============================================================================
# owl_gc — ocaml-auto-compact fine-grained O= sweep (500-1000 gap)
# =============================================================================
# Part of the auto-compact tuning investigation (TASK 1 in PLAN.md).
#
# The earlier owl_gc_O_sweep.yml tested O=[20,50,100,200,500,1000,2000] and
# found a hard cliff for ocaml-auto-compact: 100% compaction rate (and
# ~45.5% gc_overhead, ~5.83s wall) at O<=500, 0% compaction (~31.6%
# gc_overhead, ~4.65s wall) at O>=1000 -- but nothing was ever sampled
# between 500 and 1000, even though owl_gc's actual measured overhead
# (~690-740% via the v=0x200 verbose trace) sits right in that gap. This
# sweep fills it in to find the real transition point and check whether
# there's a useful middle ground (partial compaction rate trading some
# wall-time cost for some RSS reduction) rather than a pure step function.
#
# (Not sweeping socaml-auto-compact here: confirmed via direct v=0x200
# tracing that owl_gc's major cycles complete exclusively via opportunistic
# slices on that runtime, so should_compact_from_stw_single is never even
# called -- 0 compactions at every O= regardless of the chunk-size knob.
# See experiments/auto-compact-tuning/worklog.md Phase 7.)
# =============================================================================

includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 5
  benchmarks:
    macro-owl:
      - owl_gc

runtimes:
  ocaml-auto-compact:
    type: OCaml
    repo: "https://github.com/curche/ocaml.git"
    commit: "auto-compact-5.5"

modifiers:
  O:
    type: OCamlRunParam
    val: "O={0}"

configs:
  - "ocaml-auto-compact|perf_grp1|re-25|md-2"

config_sweep:
  O: [600, 650, 700, 720, 740, 750, 760, 780, 800, 850, 900, 950, 1000]
